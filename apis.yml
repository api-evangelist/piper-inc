name: Piper Inc.
description: >-
  Piper (Piper Learning, Inc. / Piper LLC) is an educational-technology company that
  makes hands-on STEM learning kits — most notably the Piper Computer Kit, a buildable
  wooden computer that teaches circuitry and coding through Minecraft, and Piper Make,
  a browser-based platform for exploring electronics and Python. Its consumer storefront
  runs on Shopify and exposes an agent-commerce surface: a Universal Commerce Protocol
  (UCP) merchant profile with an MCP endpoint plus Shopify Customer Account OpenID
  Connect, letting AI shopping agents search the catalog, build carts, and check out
  with explicit buyer approval. Surfaced as a 500 Global portfolio company and enriched
  from its live public agent/discovery surface.
